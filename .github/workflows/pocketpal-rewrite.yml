name: Sandev Chat — PocketPal architecture rewrite

on:
  workflow_dispatch:
  push:
    branches: [rewrite/pocketpal-architecture]
    paths:
      - '.github/pocketpal-host/**'
      - '.github/scripts/port_pocketpal_runtime.py'
      - '.github/workflows/pocketpal-rewrite.yml'
      - 'sandev-chat-alpha-0.2.zip'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate React Native app and preserve Sandev UI
        run: python3 .github/scripts/port_pocketpal_runtime.py
      - name: Install JS dependencies
        working-directory: .migration-work/SandevChat
        run: npm install
      - name: TypeScript check
        working-directory: .migration-work/SandevChat
        run: npx tsc --noEmit
      - name: Build release APK
        working-directory: .migration-work/SandevChat/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign installable test APK
        working-directory: .migration-work/SandevChat/android
        run: |
          KEYSTORE="$RUNNER_TEMP/sandev-debug.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/sandev-chat-pocketpal.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify app/build/outputs/apk/release/sandev-chat-pocketpal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sandev-chat-pocketpal-rewrite
          path: .migration-work/SandevChat/android/app/build/outputs/apk/release/sandev-chat-pocketpal.apk
          if-no-files-found: error
          retention-days: 14
