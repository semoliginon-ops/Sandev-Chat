name: STARFALL RPG - local Gemma prototype
on:
  workflow_dispatch:
  pull_request:
    branches: [game/asterfall-action-map]
    paths:
      - 'starfall-rpg/**'
      - 'native-sandev/scripts/**'
      - 'native-sandev/patches/**'
      - 'native-sandev/gradle/libs.versions.toml'
      - '.github/workflows/starfall-rpg.yml'
  push:
    branches: [game/starfall-rpg-prototype, game/asterfall-action-map, game/starfall-local-gemma-ai]
    paths:
      - 'starfall-rpg/**'
      - 'native-sandev/scripts/**'
      - 'native-sandev/patches/**'
      - 'native-sandev/gradle/libs.versions.toml'
      - '.github/workflows/starfall-rpg.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare pinned low-memory llama.cpp engine
        run: ./scripts/prepare-engine.sh
        working-directory: native-sandev
      - name: Fetch CC0 animated fantasy sprites
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/graphics
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/samurai_blue/sprite.png" -o starfall-rpg/app/src/main/assets/graphics/hero_samurai.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/ninja_blue/sprite.png" -o starfall-rpg/app/src/main/assets/graphics/gemma_ninja.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/pig/pig.png" -o starfall-rpg/app/src/main/assets/graphics/pig.png
      - name: Import uploaded area backgrounds without renaming source files
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/areas
          for area in forest rawa pantai pegunungan salju gurun vulkanik; do
            mkdir -p "starfall-rpg/app/src/main/assets/areas/$area"
            if [ -d "asset starfall rpg/$area" ]; then
              find "asset starfall rpg/$area" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} "starfall-rpg/app/src/main/assets/areas/$area/" \;
            else
              echo "No uploaded asset folder for $area; skipping."
            fi
          done
      - name: Fetch extra CC0 shooter and impact sound variants
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/audio/extra
          base="https://raw.githubusercontent.com/Mcamento8/open-game-sfx-index/main/audio"
          for file in laserSmall_000 laserSmall_001 laserSmall_002 laserSmall_003 laserSmall_004 laserRetro_000 laserRetro_001 laserRetro_002 laserRetro_003 laserRetro_004 laserLarge_000 laserLarge_001 laserLarge_002 explosionCrunch_000 explosionCrunch_001 explosionCrunch_002; do
            curl -fL --retry 2 "$base/sci-fi-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg" || echo "Optional sound unavailable: $file"
          done
          for file in impactGeneric_light_000 impactGeneric_light_001 impactGeneric_light_002; do
            curl -fL --retry 2 "$base/impact-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg" || echo "Optional sound unavailable: $file"
          done
          for file in impactMetal_000 impactMetal_001; do
            curl -fL --retry 3 "$base/sci-fi-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg" || echo "Optional sound unavailable: $file"
          done
          for file in footstep00 footstep01 footstep02 footstep03 footstep04; do
            curl -fL --retry 2 "https://raw.githubusercontent.com/Mcamento8/open-game-sfx-index/main/audio/rpg-audio/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg" || echo "Optional sound unavailable: $file"
          done
      - name: Build STARFALL RPG debug APK
        working-directory: starfall-rpg
        run: ../native-sandev/gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: starfall-rpg-local-gemma
          path: starfall-rpg/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
