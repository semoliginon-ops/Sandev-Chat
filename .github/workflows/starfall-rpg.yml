name: STARFALL RPG - prototype APK (compile fix)
on:
  workflow_dispatch:
  push:
    branches: [game/starfall-rpg-prototype]
    paths:
      - 'starfall-rpg/**'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch CC0 animated fantasy sprites
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/graphics
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/samurai_blue/sprite.png" -o starfall-rpg/app/src/main/assets/graphics/hero_samurai.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/ninja_blue/sprite.png" -o starfall-rpg/app/src/main/assets/graphics/gemma_ninja.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/pig/pig.png" -o starfall-rpg/app/src/main/assets/graphics/pig.png
      - name: Import uploaded area backgrounds without renaming source files
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/areas
          for area in forest rawa pantai pegunungan salju gurun vulkanik; do
            mkdir -p "starfall-rpg/app/src/main/assets/areas/$area"
            find "asset starfall rpg/$area" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} "starfall-rpg/app/src/main/assets/areas/$area/" \;
          done
      - name: Fetch extra CC0 shooter and impact sound variants
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/audio/extra
          base="https://raw.githubusercontent.com/Mcamento8/open-game-sfx-index/main/audio"
          for file in laserSmall_000 laserSmall_001 laserSmall_002 laserSmall_003 laserSmall_004 laserRetro_000 laserRetro_001 laserRetro_002 laserLarge_000 laserLarge_001 explosionCrunch_000 explosionCrunch_001 explosionCrunch_002; do
            curl -fL --retry 3 "$base/sci-fi-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg"
          done
          for file in impactGeneric_light_000 impactGeneric_light_001 impactGeneric_light_002; do
            curl -fL --retry 3 "$base/impact-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg"
          done
          for file in impactMetal_000 impactMetal_001; do
            curl -fL --retry 3 "$base/sci-fi-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg"
          done
          for file in footstep_grass_000 footstep_grass_001 footstep_grass_002 footstep_grass_003 footstep_grass_004; do
            curl -fL --retry 3 "$base/impact-sounds/$file.ogg" -o "starfall-rpg/app/src/main/assets/audio/extra/$file.ogg"
          done
      - name: Build STARFALL RPG debug APK
        working-directory: starfall-rpg
        run: ../native-sandev/gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: starfall-rpg-prototype
          path: starfall-rpg/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
