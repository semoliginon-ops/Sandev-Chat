name: STARFALL RPG - prototype APK (compile fix)
on:
  workflow_dispatch:
  push:
    branches: [game/starfall-rpg-prototype]
    paths:
      - 'starfall-rpg/**'
      - '.github/workflows/starfall-rpg.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch CC0 animated fantasy sprites
        run: |
          mkdir -p starfall-rpg/app/src/main/assets/graphics
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/samurai_blue/sprite.png" -o starfall-rpg/app/src/main/assets/graphics/hero_samurai.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/ninja_blue/sprite.png" -o starfall-rpg/app/src/main/assets/graphics/gemma_ninja.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/sang-guru/NinjaAdventure/main/content/character/pig/pig.png" -o starfall-rpg/app/src/main/assets/graphics/pig.png
      - name: Build STARFALL RPG debug APK
        working-directory: starfall-rpg
        run: ../native-sandev/gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: starfall-rpg-prototype
          path: starfall-rpg/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
