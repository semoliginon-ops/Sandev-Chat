name: SANDEV Starfall 1945 — prototype APK
on:
  workflow_dispatch:
  push:
    branches: [game/starfall-1945-prototype]
    paths:
      - 'starfall-1945/**'
      - '.github/workflows/starfall-1945.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build prototype debug APK
        working-directory: starfall-1945
        run: ../native-sandev/gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sandev-starfall-1945-prototype
          path: starfall-1945/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
