name: Build SANDEV Life Android APK

on:
  push:
    branches:
      - feature/sandev-life-local-game
    paths:
      - '.github/workflows/build-sandev-life-apk.yml'
      - 'sandev-life/**'
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: sandev-life-native-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SANDEV Life branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Fetch pinned llama.cpp native engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/cpp/llama.cpp
          git -C android/app/src/main/cpp/llama.cpp init
          git -C android/app/src/main/cpp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C android/app/src/main/cpp/llama.cpp fetch --depth 1 origin 6b9ba4f2e8c1436511956f0b3c309e2c9e642071
          git -C android/app/src/main/cpp/llama.cpp checkout --detach FETCH_HEAD
          test -s android/app/src/main/cpp/llama.cpp/include/llama.h
          echo "Using llama.cpp commit $(git -C android/app/src/main/cpp/llama.cpp rev-parse --short HEAD)"

      - name: Validate game JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("sandev-life/index.html").read_text()
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          assert scripts, "No game module script found"
          assert "Wllama" not in html and "wllama" not in html, "Legacy WebAssembly runtime still referenced"
          assert 'import { Wllama }' not in html, "Legacy Wllama import still present"
          assert 'AndroidBridge' in html and 'nativeCall("generate"' in html, "Native inference bridge not connected"
          Path("/tmp/sandev-life-check.mjs").write_text(scripts[-1])
          print("Validated native llama.cpp game bridge and extracted module.")
          PY
          node --check /tmp/sandev-life-check.mjs

      - name: Build debug APK with native llama.cpp
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK uses native llama.cpp and bundles no model
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libsandev_llama.so'
          if unzip -l "$APK" | grep -E 'assets/model\.gguf|assets/wllama/'; then
            echo "ERROR: APK must not bundle a model or Wllama runtime."
            exit 1
          fi
          SIZE="$(wc -c < "$APK" | tr -d ' ')"
          echo "APK size: $SIZE bytes"
          test "$SIZE" -lt 80000000
          ls -lh "$APK"

      - name: Upload SANDEV Life APK
        uses: actions/upload-artifact@v4
        with:
          name: SANDEV-Life-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
