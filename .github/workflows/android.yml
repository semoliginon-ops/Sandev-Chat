name: Build Sandev Chat APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feature/build36-integrated-gemma-rpg']
    paths:
      - 'native-sandev/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Sandev Chat source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned llama.cpp engine
        run: sh native-sandev/scripts/prepare-engine.sh
      - name: Compile integrated Sandev Chat APK
        working-directory: native-sandev
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify APK and report metadata
        run: |
          APK="native-sandev/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "APK package configuration:"
          grep -E 'applicationId|versionCode|versionName' native-sandev/app/build.gradle.kts
      - name: Upload integrated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sandev-chat-rpg-native-debug
          path: native-sandev/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
