name: Train SANDEV Game AI GGUF

on:
  push:
    branches: [feature/sandev-game-gguf]
    paths:
      - '.github/workflows/train-sandev-game-ai.yml'
      - 'native-sandev/model-training/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-convert-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout SANDEV source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch transformers accelerate safetensors sentencepiece

      - name: Fine-tune SANDEV game decision model
        env:
          MODEL_OUT: ${{ github.workspace }}/artifacts/sandev-game-ai-hf
        run: |
          python native-sandev/model-training/train_game_ai.py

      - name: Get llama.cpp converter and quantizer
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git tools/llama.cpp
          python -m pip install -e tools/llama.cpp/gguf-py
          cmake -S tools/llama.cpp -B tools/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build tools/llama.cpp/build --config Release -j 2 --target llama-cli llama-quantize

      - name: Convert fine-tuned weights to GGUF and quantize
        run: |
          mkdir -p artifacts/final
          python tools/llama.cpp/convert_hf_to_gguf.py artifacts/sandev-game-ai-hf --outfile artifacts/final/SANDEV-Game-AI-f16.gguf --outtype f16
          tools/llama.cpp/build/bin/llama-quantize artifacts/final/SANDEV-Game-AI-f16.gguf artifacts/final/SANDEV-Game-AI-Q4_K_M.gguf Q4_K_M
          rm artifacts/final/SANDEV-Game-AI-f16.gguf

      - name: Validate GGUF and smoke-test inference
        run: |
          MODEL=artifacts/final/SANDEV-Game-AI-Q4_K_M.gguf
          test -s "$MODEL"
          SIZE=$(wc -c < "$MODEL" | tr -d ' ')
          echo "GGUF size: $SIZE bytes"
          test "$SIZE" -le 150000000
          MAGIC=$(od -An -tx1 -N4 "$MODEL" | tr -d ' \n')
          test "$MAGIC" = "47475546"
          tools/llama.cpp/build/bin/llama-cli \
            -m "$MODEL" \
            -p 'Choose the best legal action. Return exactly ACTION: <id>. Game genre: turn-based RPG. State: health 0.2, resources 0.7, threat 0.9, uncertainty 0.1, objective_urgency 0.8. Legal actions: act_101 progress 0.2 survival 0.1 risk 0.9 cost 0.1; act_202 progress 0.7 survival 0.9 risk 0.1 cost 0.2' \
            -n 16 --temp 0 --no-display-prompt > artifacts/final/smoke-test.txt 2>&1
          cat artifacts/final/smoke-test.txt
          sha256sum "$MODEL" > artifacts/final/SHA256SUMS.txt
          cp artifacts/sandev-game-ai-hf/training-report.json artifacts/final/
          echo "size_bytes=$SIZE" > artifacts/final/model-metadata.txt
          echo "quantization=Q4_K_M" >> artifacts/final/model-metadata.txt
          echo "base_checkpoint=HuggingFaceTB/SmolLM2-135M-Instruct" >> artifacts/final/model-metadata.txt
          echo "training=full fine-tuning on generated SANDEV game-decision examples" >> artifacts/final/model-metadata.txt

      - name: Upload SANDEV Game AI GGUF
        uses: actions/upload-artifact@v4
        with:
          name: SANDEV-Game-AI-GGUF-Q4_K_M
          path: artifacts/final/*
          if-no-files-found: error
          retention-days: 30
